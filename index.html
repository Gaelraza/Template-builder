<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget Template Builder</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-screen bg-base-200">
    <header class="navbar bg-primary text-primary-content shadow-lg">
        <div class="flex-1"><h1 class="text-2xl font-bold">📊 Budget Template Builder</h1></div>
        <div class="flex-none gap-2"><span class="badge badge-outline">Personal Use</span></div>
    </header>

    <main class="container mx-auto p-4 lg:p-6">
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <!-- Editor Panel -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h2 class="card-title text-xl mb-4">⚙️ Template Editor</h2>
                    
                    <div class="collapse collapse-arrow bg-base-200 mb-2">
                        <input type="checkbox" checked />
                        <div class="collapse-title text-lg font-medium">Basic Settings</div>
                        <div class="collapse-content space-y-3">
                            <div class="form-control">
                                <label class="label"><span class="label-text">Template Name</span></label>
                                <input type="text" id="templateName" class="input input-bordered input-sm w-full" value="Monthly Budget Tracker" />
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">Currency Symbol</span></label>
                                <input type="text" id="currencySymbol" class="input input-bordered input-sm w-full" value="$" />
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">Budget Period</span></label>
                                <select id="budgetPeriod" class="select select-bordered select-sm w-full">
                                    <option value="monthly">Monthly</option>
                                    <option value="weekly">Weekly</option>
                                    <option value="yearly">Yearly</option>
                                </select>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">Start Month</span></label>
                                <select id="startMonth" class="select select-bordered select-sm w-full">
                                    <option value="0">January</option><option value="1">February</option>
                                    <option value="2">March</option><option value="3">April</option>
                                    <option value="4">May</option><option value="5">June</option>
                                    <option value="6">July</option><option value="7">August</option>
                                    <option value="8">September</option><option value="9">October</option>
                                    <option value="10">November</option><option value="11">December</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="collapse collapse-arrow bg-base-200 mb-2">
                        <input type="checkbox" checked />
                        <div class="collapse-title text-lg font-medium">💰 Income Categories</div>
                        <div class="collapse-content">
                            <div id="incomeCategories" class="space-y-2"></div>
                            <button class="btn btn-sm btn-outline mt-2" onclick="addCategory('income')">+ Add Category</button>
                        </div>
                    </div>

                    <div class="collapse collapse-arrow bg-base-200 mb-2">
                        <input type="checkbox" checked />
                        <div class="collapse-title text-lg font-medium">💸 Expense Categories</div>
                        <div class="collapse-content">
                            <div id="expenseCategories" class="space-y-2"></div>
                            <button class="btn btn-sm btn-outline mt-2" onclick="addCategory('expense')">+ Add Category</button>
                        </div>
                    </div>

                    <div class="collapse collapse-arrow bg-base-200 mb-2">
                        <input type="checkbox" />
                        <div class="collapse-title text-lg font-medium">🎨 Styling & UI</div>
                        <div class="collapse-content space-y-3">
                            <div class="form-control">
                                <label class="label"><span class="label-text">Quick Themes</span></label>
                                <div class="flex gap-2 flex-wrap">
                                    <button class="btn btn-sm btn-outline" onclick="Editor.applyTheme('warm')">🔥 Warm & Cozy</button>
                                    <button class="btn btn-sm btn-outline" onclick="Editor.applyTheme('professional')">💼 Sharp & Professional</button>
                                    <button class="btn btn-sm btn-outline" onclick="Editor.applyTheme('cute')">🌈 Cute & Colourful</button>
                                </div>
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">Header Color</span></label>
                                <input type="color" id="headerColor" class="w-full h-10" value="#3b82f6" />
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">Accent Color</span></label>
                                <input type="color" id="accentColor" class="w-full h-10" value="#10b981" />
                            </div>
                            <div class="form-control">
                                <label class="label"><span class="label-text">Font Family</span></label>
                                <select id="fontFamily" class="select select-bordered select-sm w-full">
                                    <option value="Arial, sans-serif">Arial</option>
                                    <option value="Times New Roman, serif">Times New Roman</option>
                                    <option value="Courier New, monospace">Courier New</option>
                                    <option value="Georgia, serif">Georgia</option>
                                    <option value="Verdana, sans-serif">Verdana</option>
                                </select>
                            </div>
                            <div class="form-control">
                                <label class="label cursor-pointer">
                                    <span class="label-text">Show Grid Lines</span>
                                    <input type="checkbox" id="showGrid" class="checkbox checkbox-sm" checked />
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="collapse collapse-arrow bg-base-200 mb-2">
                        <input type="checkbox" checked />
                        <div class="collapse-title text-lg font-medium">✨ Features</div>
                        <div class="collapse-content space-y-2">
                            <div class="form-control">
                                <label class="label cursor-pointer">
                                    <span class="label-text">Auto-Sum Formulas</span>
                                    <input type="checkbox" id="autoSum" class="checkbox checkbox-sm" checked />
                                </label>
                            </div>
                            <div class="form-control">
                                <label class="label cursor-pointer">
                                    <span class="label-text">Conditional Formatting</span>
                                    <input type="checkbox" id="conditionalFormatting" class="checkbox checkbox-sm" checked />
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="card-actions justify-end mt-4">
                        <button class="btn btn-success" onclick="exportToExcel()">📄 Export to Excel</button>
                        <button class="btn btn-primary" onclick="exportToGoogleSheets()">📊 Export to Google Sheets</button>
                    </div>
                </div>
            </div>

            <!-- Preview Panel -->
            <div class="card bg-base-100 shadow-xl">
                <div class="card-body">
                    <h2 class="card-title text-xl mb-4">👁️ Live Preview</h2>
                    <div id="previewContainer" class="overflow-x-auto"></div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer footer-center p-4 bg-base-300 text-base-content mt-8">
        <div><p>Budget Template Builder - Personal Use</p></div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script src="js/formatting.js"></script>
    <script src="js/editor.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/export-excel.js"></script>
    <script src="js/export-sheets.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
